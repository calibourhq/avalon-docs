type: object
required:
  - email
  - first_name
  - password
properties:
  email:
    type: string
    maxLength: 255
  first_name:
    type: string
    maxLength: 100
  is_owner:
    type: boolean
  last_name:
    type: string
    maxLength: 100
  password:
    type: string
    minLength: 8
  permissions:
    type: array
    items:
      type: string
