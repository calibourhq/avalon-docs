type: object
properties:
  cache_hit_rate:
    type: number
  cache_hits:
    type: integer
  cache_misses:
    type: integer
  dns_zones:
    type: array
    items:
      $ref: ./cdn.OverviewDNSZone.yaml
  errors_4xx:
    type: integer
  errors_5xx:
    type: integer
  http_status:
    type: object
    additionalProperties:
      type: integer
      format: int64
  locations:
    type: array
    items:
      $ref: ./cdn.OverviewLocation.yaml
  points:
    type: array
    items:
      $ref: ./cdn.MetricsPoint.yaml
  total_bandwidth:
    type: integer
  total_requests:
    type: integer
  verify_challenges:
    description: |-
      Browser validation: challenge pages served vs. validations passed. A
      falling success/challenge ratio fleet-wide means an attack in progress or
      a false-positive problem after a rule change.
    type: integer
  verify_successes:
    type: integer
