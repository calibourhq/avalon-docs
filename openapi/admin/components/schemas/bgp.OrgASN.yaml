type: object
required:
  - asn
properties:
  admin_notes:
    type: string
  as_set_error:
    type: string
  as_set_synced_at:
    description: |-
      Outcome of the last RIPE AS-SET membership update for this ASN (see
      ripe_asset.go). Both stay zero when the integration is not configured.
    type: string
  asn:
    type: integer
    minimum: 1
  created_at:
    type: string
  id:
    type: string
  org_id:
    type: string
  prefixes:
    type: array
    items:
      $ref: ./bgp.ASNPrefix.yaml
  status:
    $ref: ./bgp.ASNStatus.yaml
  updated_at:
    type: string
  verification:
    description: |-
      Verification is how the customer's request is being (or was) verified;
      nil for ASNs an admin created. Filled by the getters below, not a GORM
      association: the row outlives the ASN (see asn_verification.go).
    allOf:
      - $ref: ./bgp.ASNVerification.yaml
