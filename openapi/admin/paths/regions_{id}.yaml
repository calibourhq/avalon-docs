put:
  operationId: update-a-region
  security:
    - BearerAuth: []
  description: Update an existing region.
  tags:
    - settings
  summary: Update a region
  parameters:
    - description: id
      name: id
      in: path
      required: true
      schema:
        type: string
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            $ref: ../components/schemas/regions.Region.yaml
    '400':
      description: Bad Request
      content:
        application/json:
          schema:
            $ref: ../components/schemas/errors.ValidationErrorResponse.yaml
    '401':
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: ../components/schemas/errors.AppError.yaml
    '404':
      description: Not Found
      content:
        application/json:
          schema:
            $ref: ../components/schemas/errors.AppError.yaml
    '409':
      description: Conflict
      content:
        application/json:
          schema:
            $ref: ../components/schemas/errors.AppError.yaml
    '500':
      description: Internal Server Error
      content:
        application/json:
          schema:
            $ref: ../components/schemas/errors.AppError.yaml
delete:
  operationId: delete-a-region
  security:
    - BearerAuth: []
  description: Delete a region by id.
  tags:
    - settings
  summary: Delete a region
  parameters:
    - description: id
      name: id
      in: path
      required: true
      schema:
        type: string
  responses:
    '204':
      description: No Content
    '401':
      description: Unauthorized
      content:
        '*/*':
          schema:
            $ref: ../components/schemas/errors.AppError.yaml
    '404':
      description: Not Found
      content:
        '*/*':
          schema:
            $ref: ../components/schemas/errors.AppError.yaml
    '500':
      description: Internal Server Error
      content:
        '*/*':
          schema:
            $ref: ../components/schemas/errors.AppError.yaml
