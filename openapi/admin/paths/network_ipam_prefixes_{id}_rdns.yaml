get:
  operationId: get-reverse-dns-status-for-a-prefix
  security:
    - BearerAuth: []
  description: Returns the reverse DNS link status for a prefix.
  tags:
    - network-ipam
  summary: Get reverse DNS status for a prefix
  parameters:
    - description: prefix id
      name: id
      in: path
      required: true
      schema:
        type: string
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
    '400':
      description: Bad Request
      content:
        application/json:
          schema:
            $ref: ../components/schemas/errors.ValidationErrorResponse.yaml
    '401':
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: ../components/schemas/errors.AppError.yaml
    '500':
      description: Internal Server Error
      content:
        application/json:
          schema:
            $ref: ../components/schemas/errors.AppError.yaml
