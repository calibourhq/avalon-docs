post:
  operationId: refund-invoice-admin
  security:
    - BearerAuth: []
  description: Issues a refund against a paid invoice.
  tags:
    - invoices
  summary: Refund invoice (admin)
  parameters:
    - description: invoice id
      name: inv_id
      in: path
      required: true
      schema:
        type: string
  requestBody:
    content:
      application/json:
        schema:
          $ref: ../components/schemas/billing.CreateRefundRequest.yaml
    description: Refund request
    required: true
  responses:
    '201':
      description: Created
      content:
        application/json:
          schema:
            $ref: ../components/schemas/billing.Refund.yaml
    '400':
      description: Bad Request
      content:
        application/json:
          schema:
            $ref: ../components/schemas/errors.ValidationErrorResponse.yaml
    '401':
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: ../components/schemas/errors.AppError.yaml
    '500':
      description: Internal Server Error
      content:
        application/json:
          schema:
            $ref: ../components/schemas/errors.AppError.yaml
