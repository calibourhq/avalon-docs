delete:
  operationId: remove-promo-code-admin
  security:
    - BearerAuth: []
  description: Removes the applied promo code from a draft invoice.
  tags:
    - invoices
  summary: Remove promo code (admin)
  parameters:
    - description: invoice id
      name: inv_id
      in: path
      required: true
      schema:
        type: string
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            $ref: ../components/schemas/billing.Invoice.yaml
    '400':
      description: Bad Request
      content:
        application/json:
          schema:
            $ref: ../components/schemas/errors.ValidationErrorResponse.yaml
    '401':
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: ../components/schemas/errors.AppError.yaml
    '500':
      description: Internal Server Error
      content:
        application/json:
          schema:
            $ref: ../components/schemas/errors.AppError.yaml
