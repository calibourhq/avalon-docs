get:
  operationId: get-one-dashboard-widgets-data
  security:
    - BearerAuth: []
  tags:
    - admin
  summary: Get one dashboard widget's data
  parameters:
    - description: Widget id
      name: id
      in: path
      required: true
      schema:
        type: string
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
    '403':
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: ../components/schemas/errors.AppError.yaml
    '404':
      description: Not Found
      content:
        application/json:
          schema:
            $ref: ../components/schemas/errors.AppError.yaml
