put:
  operationId: set-a-vps-primary-ip
  security:
    - BearerAuth: []
  description: >-
    Designates one of the server's assigned IPs as the primary address for its family.
  tags:
    - vps
  summary: Set a VPS primary IP
  parameters:
    - description: server id
      name: id
      in: path
      required: true
      schema:
        type: string
    - description: address id
      name: addr_id
      in: path
      required: true
      schema:
        type: string
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
    '400':
      description: Bad Request
      content:
        application/json:
          schema:
            $ref: ../components/schemas/errors.ValidationErrorResponse.yaml
    '401':
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: ../components/schemas/errors.AppError.yaml
    '500':
      description: Internal Server Error
      content:
        application/json:
          schema:
            $ref: ../components/schemas/errors.AppError.yaml
