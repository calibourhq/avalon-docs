get:
  operationId: list-vps-cluster-cpu-models
  security:
    - BearerAuth: []
  description: >-
    Return the QEMU CPU models available on every online node of the cluster, for picking the cluster-wide default.
  tags:
    - vps
  summary: List VPS cluster CPU models
  parameters:
    - description: cluster id
      name: id
      in: path
      required: true
      schema:
        type: string
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: ../components/schemas/proxmox.CPUModel.yaml
    '400':
      description: Bad Request
      content:
        application/json:
          schema:
            $ref: ../components/schemas/errors.ValidationErrorResponse.yaml
    '401':
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: ../components/schemas/errors.AppError.yaml
    '500':
      description: Internal Server Error
      content:
        application/json:
          schema:
            $ref: ../components/schemas/errors.AppError.yaml
