delete:
  operationId: clear-a-customers-totp-2fa
  security:
    - BearerAuth: []
  description: >-
    Removes the TOTP configuration for an org member so they can log in with password only (admin only).
  tags:
    - two-factor
  summary: Clear a customer's TOTP 2FA
  parameters:
    - description: Organisation ID
      name: id
      in: path
      required: true
      schema:
        type: string
    - description: Member user ID
      name: uid
      in: path
      required: true
      schema:
        type: string
  responses:
    '204':
      description: No Content
    '400':
      description: Bad Request
      content:
        application/json:
          schema:
            $ref: ../components/schemas/errors.AppError.yaml
    '404':
      description: Not Found
      content:
        application/json:
          schema:
            $ref: ../components/schemas/errors.AppError.yaml
    '500':
      description: Internal Server Error
      content:
        application/json:
          schema:
            $ref: ../components/schemas/errors.AppError.yaml
