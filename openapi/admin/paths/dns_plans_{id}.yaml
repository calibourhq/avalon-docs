put:
  operationId: update-a-dns-plan
  security:
    - BearerAuth: []
  description: Updates a DNS plan (admin only).
  tags:
    - dns
  summary: Update a DNS plan
  parameters:
    - description: plan id
      name: id
      in: path
      required: true
      schema:
        type: string
  requestBody:
    $ref: ../components/requestBodies/dns.DNSPlanInput.yaml
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
    '400':
      description: Bad Request
      content:
        application/json:
          schema:
            $ref: ../components/schemas/errors.ValidationErrorResponse.yaml
    '401':
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: ../components/schemas/errors.AppError.yaml
    '500':
      description: Internal Server Error
      content:
        application/json:
          schema:
            $ref: ../components/schemas/errors.AppError.yaml
delete:
  operationId: delete-a-dns-plan
  security:
    - BearerAuth: []
  description: Removes a DNS plan (admin only).
  tags:
    - dns
  summary: Delete a DNS plan
  parameters:
    - description: plan id
      name: id
      in: path
      required: true
      schema:
        type: string
  responses:
    '204':
      description: No Content
    '400':
      description: Bad Request
      content:
        '*/*':
          schema:
            $ref: ../components/schemas/errors.ValidationErrorResponse.yaml
    '401':
      description: Unauthorized
      content:
        '*/*':
          schema:
            $ref: ../components/schemas/errors.AppError.yaml
    '500':
      description: Internal Server Error
      content:
        '*/*':
          schema:
            $ref: ../components/schemas/errors.AppError.yaml
