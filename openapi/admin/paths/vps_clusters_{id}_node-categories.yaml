get:
  operationId: list-a-vps-clusters-node-categories
  security:
    - BearerAuth: []
  description: Maps tagged node names to their category id; an untagged node hosts no plan.
  tags:
    - vps
  summary: List a VPS cluster's node categories
  parameters:
    - description: cluster id
      name: id
      in: path
      required: true
      schema:
        type: string
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            type: object
            additionalProperties:
              type: string
