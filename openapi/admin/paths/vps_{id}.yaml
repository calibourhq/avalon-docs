get:
  operationId: get-a-vps-server
  security:
    - BearerAuth: []
  description: >-
    Returns a single VPS server with live power state and enriched plan/renewal details.
  tags:
    - vps
  summary: Get a VPS server
  parameters:
    - description: vps id
      name: id
      in: path
      required: true
      schema:
        type: string
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            $ref: ../components/schemas/vps.VPSServer.yaml
    '400':
      description: Bad Request
      content:
        application/json:
          schema:
            $ref: ../components/schemas/errors.ValidationErrorResponse.yaml
    '401':
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: ../components/schemas/errors.AppError.yaml
    '500':
      description: Internal Server Error
      content:
        application/json:
          schema:
            $ref: ../components/schemas/errors.AppError.yaml
put:
  operationId: update-vps-server-admin
  security:
    - BearerAuth: []
  description: >-
    Update admin-editable fields (hostname, SSH keys, IP assignments) on a server.
  tags:
    - vps
  summary: Update VPS server (admin)
  parameters:
    - description: server id
      name: id
      in: path
      required: true
      schema:
        type: string
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            $ref: ../components/schemas/vps.VPSServer.yaml
    '400':
      description: Bad Request
      content:
        application/json:
          schema:
            $ref: ../components/schemas/errors.ValidationErrorResponse.yaml
    '401':
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: ../components/schemas/errors.AppError.yaml
    '500':
      description: Internal Server Error
      content:
        application/json:
          schema:
            $ref: ../components/schemas/errors.AppError.yaml
