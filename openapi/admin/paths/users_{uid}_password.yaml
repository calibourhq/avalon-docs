post:
  operationId: set-a-customers-password
  security:
    - BearerAuth: []
  description: >-
    Sets a new password for a customer account and revokes its sessions (admin only).
  tags:
    - customer-accounts
  summary: Set a customer's password
  parameters:
    - description: Account (user) ID
      name: uid
      in: path
      required: true
      schema:
        type: string
  requestBody:
    content:
      application/json:
        schema:
          $ref: ../components/schemas/api.AdminSetPasswordRequest.yaml
    description: New password
    required: true
  responses:
    '204':
      description: No Content
    '400':
      description: Bad Request
      content:
        application/json:
          schema:
            $ref: ../components/schemas/errors.ValidationErrorResponse.yaml
    '404':
      description: Not Found
      content:
        application/json:
          schema:
            $ref: ../components/schemas/errors.AppError.yaml
