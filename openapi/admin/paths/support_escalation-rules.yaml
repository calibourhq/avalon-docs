get:
  operationId: list-escalation-rules
  security:
    - BearerAuth: []
  description: Return all support escalation rules.
  tags:
    - support
  summary: List escalation rules
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: ../components/schemas/support.SupportEscalationRule.yaml
    '401':
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: ../components/schemas/errors.AppError.yaml
    '500':
      description: Internal Server Error
      content:
        application/json:
          schema:
            $ref: ../components/schemas/errors.AppError.yaml
post:
  operationId: create-escalation-rule
  security:
    - BearerAuth: []
  description: Create a new support escalation rule.
  tags:
    - support
  summary: Create escalation rule
  responses:
    '201':
      description: Created
      content:
        application/json:
          schema:
            $ref: ../components/schemas/support.SupportEscalationRule.yaml
    '400':
      description: Bad Request
      content:
        application/json:
          schema:
            $ref: ../components/schemas/errors.ValidationErrorResponse.yaml
    '401':
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: ../components/schemas/errors.AppError.yaml
    '500':
      description: Internal Server Error
      content:
        application/json:
          schema:
            $ref: ../components/schemas/errors.AppError.yaml
