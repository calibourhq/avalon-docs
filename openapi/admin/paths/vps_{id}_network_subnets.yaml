post:
  operationId: assign-a-routed-subnet-to-a-vps
  security:
    - BearerAuth: []
  description: >-
    Allocates a new routed subnet from the cluster's routed pool and assigns it to the server.
  tags:
    - vps
  summary: Assign a routed subnet to a VPS
  parameters:
    - description: server id
      name: id
      in: path
      required: true
      schema:
        type: string
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
    '400':
      description: Bad Request
      content:
        application/json:
          schema:
            $ref: ../components/schemas/errors.ValidationErrorResponse.yaml
    '401':
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: ../components/schemas/errors.AppError.yaml
    '500':
      description: Internal Server Error
      content:
        application/json:
          schema:
            $ref: ../components/schemas/errors.AppError.yaml
