get:
  operationId: list-admin-permissions
  security:
    - BearerAuth: []
  description: List every valid admin permission string.
  tags:
    - admin-groups
  summary: List admin permissions
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            type: array
            items:
              type: string
    '401':
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: ../components/schemas/errors.AppError.yaml
    '500':
      description: Internal Server Error
      content:
        application/json:
          schema:
            $ref: ../components/schemas/errors.AppError.yaml
