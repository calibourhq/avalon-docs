post:
  operationId: send-a-customer-a-password-reset-link
  security:
    - BearerAuth: []
  description: >-
    Queues the standard password reset email for a customer account (admin only).
  tags:
    - customer-accounts
  summary: Send a customer a password reset link
  parameters:
    - description: Account (user) ID
      name: uid
      in: path
      required: true
      schema:
        type: string
  responses:
    '204':
      description: No Content
    '400':
      description: Bad Request
      content:
        application/json:
          schema:
            $ref: ../components/schemas/errors.AppError.yaml
    '404':
      description: Not Found
      content:
        application/json:
          schema:
            $ref: ../components/schemas/errors.AppError.yaml
