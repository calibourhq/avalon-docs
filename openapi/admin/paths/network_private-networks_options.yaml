get:
  operationId: private-network-creation-options
  security:
    - BearerAuth: []
  description: >-
    For each region, list which private network kinds (vps, dedicated) the active organisation can create. Regions with no available kind are omitted.

    org_id is required.
  tags:
    - network-private
  summary: Private network creation options
  parameters:
    - description: organisation id
      name: org_id
      in: query
      schema:
        type: string
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: ../components/schemas/api.privateNetworkRegionOption.yaml
    '400':
      description: Bad Request
      content:
        application/json:
          schema:
            $ref: ../components/schemas/errors.ValidationErrorResponse.yaml
    '401':
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: ../components/schemas/errors.AppError.yaml
    '500':
      description: Internal Server Error
      content:
        application/json:
          schema:
            $ref: ../components/schemas/errors.AppError.yaml
