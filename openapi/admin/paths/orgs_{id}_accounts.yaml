post:
  operationId: create-a-local-org-account
  security:
    - BearerAuth: []
  description: >-
    Provisions a new password-based customer account with an admin-supplied password and adds them to the org. Admin-only.
  tags:
    - orgs
  summary: Create a local org account
  parameters:
    - description: organisation id
      name: id
      in: path
      required: true
      schema:
        type: string
  requestBody:
    content:
      application/json:
        schema:
          $ref: ../components/schemas/api.CreateLocalUserRequest.yaml
    description: Account details
    required: true
  responses:
    '201':
      description: Created
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
    '400':
      description: Bad Request
      content:
        application/json:
          schema:
            $ref: ../components/schemas/errors.ValidationErrorResponse.yaml
    '401':
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: ../components/schemas/errors.AppError.yaml
    '409':
      description: Conflict
      content:
        application/json:
          schema:
            $ref: ../components/schemas/errors.AppError.yaml
