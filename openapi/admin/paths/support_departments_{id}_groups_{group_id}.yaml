delete:
  operationId: remove-group-from-department
  security:
    - BearerAuth: []
  description: Detach an admin group from a support department.
  tags:
    - support
  summary: Remove group from department
  parameters:
    - description: id id
      name: id
      in: path
      required: true
      schema:
        type: string
    - description: group_id id
      name: group_id
      in: path
      required: true
      schema:
        type: string
  responses:
    '204':
      description: No Content
    '400':
      description: Bad Request
      content:
        '*/*':
          schema:
            $ref: ../components/schemas/errors.ValidationErrorResponse.yaml
    '401':
      description: Unauthorized
      content:
        '*/*':
          schema:
            $ref: ../components/schemas/errors.AppError.yaml
    '404':
      description: Not Found
      content:
        '*/*':
          schema:
            $ref: ../components/schemas/errors.AppError.yaml
    '500':
      description: Internal Server Error
      content:
        '*/*':
          schema:
            $ref: ../components/schemas/errors.AppError.yaml
