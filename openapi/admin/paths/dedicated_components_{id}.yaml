get:
  operationId: get-dedicated-hardware-component
  security:
    - BearerAuth: []
  tags:
    - dedicated
  summary: Get dedicated hardware component
  parameters:
    - description: component id
      name: id
      in: path
      required: true
      schema:
        type: string
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            $ref: ../components/schemas/dedicated.Component.yaml
put:
  operationId: update-dedicated-hardware-component
  security:
    - BearerAuth: []
  tags:
    - dedicated
  summary: Update dedicated hardware component
  parameters:
    - description: component id
      name: id
      in: path
      required: true
      schema:
        type: string
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            $ref: ../components/schemas/dedicated.Component.yaml
delete:
  operationId: delete-dedicated-hardware-component
  security:
    - BearerAuth: []
  tags:
    - dedicated
  summary: Delete dedicated hardware component
  parameters:
    - description: component id
      name: id
      in: path
      required: true
      schema:
        type: string
  responses:
    '204':
      description: No Content
