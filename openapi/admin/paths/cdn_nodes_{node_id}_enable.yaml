post:
  operationId: enable-a-cdn-node
  security:
    - BearerAuth: []
  description: Brings an edge node back into service (admin only).
  tags:
    - cdn-nodes
  summary: Enable a CDN node
  parameters:
    - description: node id
      name: node_id
      in: path
      required: true
      schema:
        type: string
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            $ref: ../components/schemas/cdn.CDNNode.yaml
