  tags:
    - dedicated
  summary: Update dedicated plan
  parameters:
    - description: plan id
      name: id
      in: path
      required: true
      schema:
        type: string
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            $ref: ../components/schemas/dedicated.DedicatedPlan.yaml
delete:
