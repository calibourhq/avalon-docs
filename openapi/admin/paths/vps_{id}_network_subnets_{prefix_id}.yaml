delete:
  operationId: remove-a-routed-subnet-from-a-vps
  security:
    - BearerAuth: []
  description: Detaches a routed subnet from a server and releases it.
  tags:
    - vps
  summary: Remove a routed subnet from a VPS
  parameters:
    - description: server id
      name: id
      in: path
      required: true
      schema:
        type: string
    - description: prefix id
      name: prefix_id
      in: path
      required: true
      schema:
        type: string
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
    '400':
      description: Bad Request
      content:
        application/json:
          schema:
            $ref: ../components/schemas/errors.ValidationErrorResponse.yaml
    '401':
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: ../components/schemas/errors.AppError.yaml
    '500':
      description: Internal Server Error
      content:
        application/json:
          schema:
            $ref: ../components/schemas/errors.AppError.yaml
