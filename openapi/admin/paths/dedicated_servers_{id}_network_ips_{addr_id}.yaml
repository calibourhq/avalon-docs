delete:
  operationId: release-an-ip-from-an-inventory-server-admin
  security:
    - BearerAuth: []
  tags:
    - dedicated
  summary: Release an IP from an inventory server (admin)
  parameters:
    - description: server id
      name: id
      in: path
      required: true
      schema:
        type: string
    - description: address id
      name: addr_id
      in: path
      required: true
      schema:
        type: string
  responses:
    '204':
      description: No Content
