get:
  operationId: get-current-account
  security:
    - BearerAuth: []
  description: >-
    Return the currently authenticated user account. API key sessions are rejected.

    returns the admin account instead.
  tags:
    - self
  summary: Get current account
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            $ref: ../components/schemas/users.User.yaml
    '401':
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: ../components/schemas/errors.AppError.yaml
    '500':
      description: Internal Server Error
      content:
        application/json:
          schema:
            $ref: ../components/schemas/errors.AppError.yaml
put:
  operationId: update-current-account
  security:
    - BearerAuth: []
  description: >-
    Update the currently authenticated user account. A changed email is not applied until the new address is verified; email_changed is then true.

    updates the admin account instead.
  tags:
    - self
  summary: Update current account
  requestBody:
    content:
      application/json:
        schema:
          $ref: ../components/schemas/api.UpdateUserRequest.yaml
    description: Profile
    required: true
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            type: object
            properties:
              email_changed:
                type: boolean
              message:
                type: string
              user:
                $ref: ../components/schemas/users.User.yaml
    '400':
      description: Bad Request
      content:
        application/json:
          schema:
            $ref: ../components/schemas/errors.ValidationErrorResponse.yaml
    '401':
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: ../components/schemas/errors.AppError.yaml
    '500':
      description: Internal Server Error
      content:
        application/json:
          schema:
            $ref: ../components/schemas/errors.AppError.yaml
