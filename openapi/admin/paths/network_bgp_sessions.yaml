get:
  operationId: list-bgp-sessions
  security:
    - BearerAuth: []
  description: |-
    List the BGP sessions of the active organisation.
    lists every org's sessions, or one org's with org_id.
  tags:
    - network-bgp
  summary: List BGP sessions
  parameters:
    - description: filter by org
      name: org_id
      in: query
      schema:
        type: string
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: ../components/schemas/bgp.BGPSession.yaml
    '401':
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: ../components/schemas/errors.AppError.yaml
    '500':
      description: Internal Server Error
      content:
        application/json:
          schema:
            $ref: ../components/schemas/errors.AppError.yaml
