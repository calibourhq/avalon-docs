get:
  operationId: get-payment-status-admin
  security:
    - BearerAuth: []
  description: Polls a payment by ID.
  tags:
    - billing
  summary: Get payment status (admin)
  parameters:
    - description: org id
      name: id
      in: path
      required: true
      schema:
        type: string
    - description: payment id
      name: payment_id
      in: path
      required: true
      schema:
        type: string
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            $ref: ../components/schemas/billing.Payment.yaml
    '400':
      description: Bad Request
      content:
        application/json:
          schema:
            $ref: ../components/schemas/errors.ValidationErrorResponse.yaml
    '401':
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: ../components/schemas/errors.AppError.yaml
    '500':
      description: Internal Server Error
      content:
        application/json:
          schema:
            $ref: ../components/schemas/errors.AppError.yaml
