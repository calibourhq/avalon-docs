get:
  operationId: get-org-billing-summary
  security:
    - BearerAuth: []
  description: >-
    Returns the aggregated billing position of an org: outstanding and overdue amounts, lifetime money received and refunded, the last payment and the credit balances.
  tags:
    - billing
  summary: Get org billing summary
  parameters:
    - description: org id
      name: id
      in: path
      required: true
      schema:
        type: string
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            $ref: ../components/schemas/billing.Summary.yaml
    '400':
      description: Bad Request
      content:
        application/json:
          schema:
            $ref: ../components/schemas/errors.ValidationErrorResponse.yaml
    '401':
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: ../components/schemas/errors.AppError.yaml
    '500':
      description: Internal Server Error
      content:
        application/json:
          schema:
            $ref: ../components/schemas/errors.AppError.yaml
