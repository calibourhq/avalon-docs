get:
  operationId: get-a-customers-notification
  security:
    - BearerAuth: []
  description: >-
    Get a single notification from an org's history, including the rendered content.
  tags:
    - notifications
  summary: Get a customer's notification
  parameters:
    - description: org id
      name: id
      in: path
      required: true
      schema:
        type: string
    - description: notification id
      name: notif_id
      in: path
      required: true
      schema:
        type: string
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            $ref: ../components/schemas/notifications.QueueItemDetail.yaml
    '400':
      description: Bad Request
      content:
        application/json:
          schema:
            $ref: ../components/schemas/errors.ValidationErrorResponse.yaml
    '401':
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: ../components/schemas/errors.AppError.yaml
    '404':
      description: Not Found
      content:
        application/json:
          schema:
            $ref: ../components/schemas/errors.AppError.yaml
    '500':
      description: Internal Server Error
      content:
        application/json:
          schema:
            $ref: ../components/schemas/errors.AppError.yaml
