delete:
  operationId: delete-bgp-asn
  security:
    - BearerAuth: []
  description: >-
    Delete a BGP ASN. Its verification history is kept, so asking again for a denied ASN goes to manual review.

    (bgp:write) purges the ASN including its verification history.
  tags:
    - network-bgp
  summary: Delete BGP ASN
  parameters:
    - description: asn id
      name: id
      in: path
      required: true
      schema:
        type: string
  responses:
    '204':
      description: No Content
    '400':
      description: Bad Request
      content:
        application/json:
          schema:
            $ref: ../components/schemas/errors.ValidationErrorResponse.yaml
    '401':
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: ../components/schemas/errors.AppError.yaml
    '500':
      description: Internal Server Error
      content:
        application/json:
          schema:
            $ref: ../components/schemas/errors.AppError.yaml
