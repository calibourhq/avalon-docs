post:
  operationId: upload-a-news-image
  security:
    - BearerAuth: []
  description: Processes an uploaded image to AVIF and returns its URL.
  tags:
    - news
  summary: Upload a news image
  requestBody:
    content:
      multipart/form-data:
        schema:
          type: object
          properties:
            image:
              description: Image file
              type: string
              format: binary
          required:
            - image
    required: true
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
    '400':
      description: Bad Request
      content:
        application/json:
          schema:
            $ref: ../components/schemas/errors.ValidationErrorResponse.yaml
    '401':
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: ../components/schemas/errors.AppError.yaml
    '500':
      description: Internal Server Error
      content:
        application/json:
          schema:
            $ref: ../components/schemas/errors.AppError.yaml
