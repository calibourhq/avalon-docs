post:
  operationId: fill-in-an-ipv4-range
  security:
    - BearerAuth: []
  description: Seed any missing address rows for an IPv4 ip_range prefix.
  tags:
    - network-ipam
  summary: Fill in an IPv4 range
  parameters:
    - description: prefix id
      name: id
      in: path
      required: true
      schema:
        type: string
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
    '400':
      description: Bad Request
      content:
        application/json:
          schema:
            $ref: ../components/schemas/errors.ValidationErrorResponse.yaml
    '401':
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: ../components/schemas/errors.AppError.yaml
    '500':
      description: Internal Server Error
      content:
        application/json:
          schema:
            $ref: ../components/schemas/errors.AppError.yaml
