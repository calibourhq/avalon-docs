post:
  operationId: approve-byoip-prefix-admin
  security:
    - BearerAuth: []
  description: Approve a pending BYOIP prefix and announce it on all route servers.
  tags:
    - network-bgp
  summary: Approve BYOIP prefix (admin)
  parameters:
    - description: byoip prefix id
      name: id
      in: path
      required: true
      schema:
        type: string
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
    '400':
      description: Bad Request
      content:
        application/json:
          schema:
            $ref: ../components/schemas/errors.ValidationErrorResponse.yaml
    '401':
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: ../components/schemas/errors.AppError.yaml
    '500':
      description: Internal Server Error
      content:
        application/json:
          schema:
            $ref: ../components/schemas/errors.AppError.yaml
