post:
  operationId: re-sync-a-route-server
  security:
    - BearerAuth: []
  description: >-
    Push the complete desired state to one route server now, instead of waiting for the next change or the periodic sweep.
  tags:
    - network-bgp
  summary: Re-sync a route server
  parameters:
    - description: route server id
      name: id
      in: path
      required: true
      schema:
        type: string
  responses:
    '202':
      description: Accepted
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
    '400':
      description: Bad Request
      content:
        application/json:
          schema:
            $ref: ../components/schemas/errors.ValidationErrorResponse.yaml
    '401':
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: ../components/schemas/errors.AppError.yaml
    '500':
      description: Internal Server Error
      content:
        application/json:
          schema:
            $ref: ../components/schemas/errors.AppError.yaml
