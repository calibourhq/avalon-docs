post:
  operationId: resync-a-vps-firewall
  security:
    - BearerAuth: []
  description: Re-apply all managed firewall and anti-spoofing rules to a VPS (admin only).
  tags:
    - network-firewall
  summary: Resync a VPS firewall
  parameters:
    - description: vps id
      name: id
      in: path
      required: true
      schema:
        type: string
  responses:
    '202':
      description: Accepted
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
    '400':
      description: Bad Request
      content:
        application/json:
          schema:
            $ref: ../components/schemas/errors.ValidationErrorResponse.yaml
    '401':
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: ../components/schemas/errors.AppError.yaml
    '500':
      description: Internal Server Error
      content:
        application/json:
          schema:
            $ref: ../components/schemas/errors.AppError.yaml
