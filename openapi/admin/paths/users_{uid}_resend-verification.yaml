post:
  operationId: resend-a-customers-email-verification
  security:
    - BearerAuth: []
  description: Queues a fresh verification email for a customer account (admin only).
  tags:
    - customer-accounts
  summary: Resend a customer's email verification
  parameters:
    - description: Account (user) ID
      name: uid
      in: path
      required: true
      schema:
        type: string
  responses:
    '204':
      description: No Content
    '400':
      description: Bad Request
      content:
        application/json:
          schema:
            $ref: ../components/schemas/errors.AppError.yaml
    '404':
      description: Not Found
      content:
        application/json:
          schema:
            $ref: ../components/schemas/errors.AppError.yaml
