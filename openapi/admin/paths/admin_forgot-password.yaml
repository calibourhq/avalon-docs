post:
  security: []
  operationId: request-an-admin-password-reset
  description: >-
    Queues a password reset email if a matching admin exists; always returns 200 to prevent email enumeration.
  tags:
    - auth
  summary: Request an admin password reset
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
    '400':
      description: Bad Request
      content:
        application/json:
          schema:
            $ref: ../components/schemas/errors.ValidationErrorResponse.yaml
    '500':
      description: Internal Server Error
      content:
        application/json:
          schema:
            $ref: ../components/schemas/errors.AppError.yaml
