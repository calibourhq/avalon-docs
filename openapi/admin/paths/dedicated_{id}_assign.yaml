post:
  operationId: assign-a-server-to-a-backordered-service-admin
  security:
    - BearerAuth: []
  description: Fulfils an awaiting_stock service by claiming a server and starting billing.
  tags:
    - dedicated
  summary: Assign a server to a backordered service (admin)
  parameters:
    - description: service id
      name: id
      in: path
      required: true
      schema:
        type: string
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            $ref: ../components/schemas/dedicated.DedicatedService.yaml
