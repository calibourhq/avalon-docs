post:
  security:
    - BearerAuth: []
  operationId: generate-a-login-as-customer-magic-link
  tags:
    - admin
  summary: Generate a login-as-customer magic link
  parameters:
    - description: Organisation ID
      name: id
      in: path
      required: true
      schema:
