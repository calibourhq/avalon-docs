put:
  operationId: update-org-api-key
  security:
    - BearerAuth: []
  description: >-
    Edits a key's name, scopes and expiry. Scopes are re-validated and re-clamped to the caller's permissions.
  tags:
    - api-keys
  summary: Update org API key
  parameters:
    - description: org id
      name: id
      in: path
      required: true
      schema:
        type: string
    - description: api key id
      name: key_id
      in: path
      required: true
      schema:
        type: string
  requestBody:
    content:
      application/json:
        schema:
          $ref: ../components/schemas/api.UpdateAPIKeyRequest.yaml
    description: Key update
    required: true
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            $ref: ../components/schemas/apikeys.APIKey.yaml
    '400':
      description: Bad Request
      content:
        application/json:
          schema:
            $ref: ../components/schemas/errors.ValidationErrorResponse.yaml
    '401':
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: ../components/schemas/errors.AppError.yaml
    '404':
      description: Not Found
      content:
        application/json:
          schema:
            $ref: ../components/schemas/errors.AppError.yaml
    '500':
      description: Internal Server Error
      content:
        application/json:
          schema:
            $ref: ../components/schemas/errors.AppError.yaml
delete:
  operationId: delete-org-api-key
  security:
    - BearerAuth: []
  description: Revokes a key immediately; the next request with its token is rejected.
  tags:
    - api-keys
  summary: Delete org API key
  parameters:
    - description: org id
      name: id
      in: path
      required: true
      schema:
        type: string
    - description: api key id
      name: key_id
      in: path
      required: true
      schema:
        type: string
  responses:
    '204':
      description: No Content
    '400':
      description: Bad Request
      content:
        application/json:
          schema:
            $ref: ../components/schemas/errors.ValidationErrorResponse.yaml
    '401':
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: ../components/schemas/errors.AppError.yaml
    '404':
      description: Not Found
      content:
        application/json:
          schema:
            $ref: ../components/schemas/errors.AppError.yaml
    '500':
      description: Internal Server Error
      content:
        application/json:
          schema:
            $ref: ../components/schemas/errors.AppError.yaml
