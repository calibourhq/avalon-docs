get:
  operationId: list-org-ssh-keys
  security:
    - BearerAuth: []
  description: >-
    Returns all SSH keys for an org, decorated with creator names. Requires ssh:read or ssh:write.
  tags:
    - ssh-keys
  summary: List org SSH keys
  parameters:
    - description: org id
      name: id
      in: path
      required: true
      schema:
        type: string
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: ../components/schemas/sshkeys.SSHKeyWithCreator.yaml
    '400':
      description: Bad Request
      content:
        application/json:
          schema:
            $ref: ../components/schemas/errors.ValidationErrorResponse.yaml
    '401':
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: ../components/schemas/errors.AppError.yaml
    '500':
      description: Internal Server Error
      content:
        application/json:
          schema:
            $ref: ../components/schemas/errors.AppError.yaml
post:
  operationId: create-org-ssh-key
  security:
    - BearerAuth: []
  description: Adds a new SSH key to an org. Requires ssh:write.
  tags:
    - ssh-keys
  summary: Create org SSH key
  parameters:
    - description: org id
      name: id
      in: path
      required: true
      schema:
        type: string
  requestBody:
    $ref: ../components/requestBodies/Request.yaml
  responses:
    '201':
      description: Created
      content:
        application/json:
          schema:
            $ref: ../components/schemas/sshkeys.SSHKey.yaml
    '400':
      description: Bad Request
      content:
        application/json:
          schema:
            $ref: ../components/schemas/errors.ValidationErrorResponse.yaml
    '401':
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: ../components/schemas/errors.AppError.yaml
    '500':
      description: Internal Server Error
      content:
        application/json:
          schema:
            $ref: ../components/schemas/errors.AppError.yaml
