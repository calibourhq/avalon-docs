delete:
  operationId: delete-payment-method
  security:
    - BearerAuth: []
  description: Removes a saved payment method.
  tags:
    - billing
  summary: Delete payment method
  parameters:
    - description: org id
      name: id
      in: path
      required: true
      schema:
        type: string
    - description: payment method id
      name: pm_id
      in: path
      required: true
      schema:
        type: string
  responses:
    '204':
      description: No Content
    '400':
      description: Bad Request
      content:
        application/json:
          schema:
            $ref: ../components/schemas/errors.ValidationErrorResponse.yaml
    '401':
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: ../components/schemas/errors.AppError.yaml
    '500':
      description: Internal Server Error
      content:
        application/json:
          schema:
            $ref: ../components/schemas/errors.AppError.yaml
