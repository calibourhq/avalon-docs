post:
  operationId: begin-passkey-registration
  security:
    - BearerAuth: []
  description: >-
    Starts a passkey enrollment ceremony for the current account. options holds the WebAuthn creation options.
  tags:
    - passkeys
  summary: Begin passkey registration
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            type: object
            properties:
              challenge_id:
                type: string
              options:
                type: object
    '401':
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: ../components/schemas/errors.AppError.yaml
    '500':
      description: Internal Server Error
      content:
        application/json:
          schema:
            $ref: ../components/schemas/errors.AppError.yaml
