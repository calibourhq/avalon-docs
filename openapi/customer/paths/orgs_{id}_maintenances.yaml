get:
  operationId: list-maintenances-affecting-an-organisation
  security:
    - BearerAuth: []
  description: >-
    Upcoming, ongoing and recently completed (last 24 hours) maintenances that affect services of the org the caller can read. Optionally narrowed to one service.
  tags:
    - maintenance
  summary: List maintenances affecting an organisation
  parameters:
    - description: org id
      name: id
      in: path
      required: true
      schema:
        type: string
    - description: vps, dedicated, hosting, email, s3, dns, cdn or domain
      name: service_type
      in: query
      schema:
        type: string
    - description: service id (with service_type)
      name: service_id
      in: query
      schema:
        type: string
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
