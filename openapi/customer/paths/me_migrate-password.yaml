post:
  operationId: migrate-oauth-account-to-local-password
  security:
    - BearerAuth: []
  description: >-
    Completes the one-way migration of the authenticated OAuth user to native auth.
  tags:
    - self
  summary: Migrate OAuth account to local password
  requestBody:
    content:
      application/json:
        schema:
          $ref: ../components/schemas/api.MigratePasswordRequest.yaml
    description: New local password
    required: true
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
    '400':
      description: Bad Request
      content:
        application/json:
          schema:
            $ref: ../components/schemas/errors.ValidationErrorResponse.yaml
    '401':
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: ../components/schemas/errors.AppError.yaml
    '404':
      description: Not Found
      content:
        application/json:
          schema:
            $ref: ../components/schemas/errors.AppError.yaml
    '500':
      description: Internal Server Error
      content:
        application/json:
          schema:
            $ref: ../components/schemas/errors.AppError.yaml
