get:
  operationId: get-vps-rrd-performance-data
  security:
    - BearerAuth: []
  description: Returns time-series performance (RRD) data for a user-owned VPS.
  tags:
    - vps
  summary: Get VPS RRD performance data
  parameters:
    - description: vps id
      name: id
      in: path
      required: true
      schema:
        type: string
    - description: timeframe (hour, day, week, month, year)
      name: timeframe
      in: query
      schema:
        type: string
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
    '400':
      description: Bad Request
      content:
        application/json:
          schema:
            $ref: ../components/schemas/errors.ValidationErrorResponse.yaml
    '401':
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: ../components/schemas/errors.AppError.yaml
    '500':
      description: Internal Server Error
      content:
        application/json:
          schema:
            $ref: ../components/schemas/errors.AppError.yaml
