get:
  security: []
  operationId: list-donation-payment-methods
  description: Returns the payment gateways available for a page.
  tags:
    - donations
  summary: List donation payment methods
  parameters:
    - description: donation page slug
      name: slug
      in: path
      required: true
      schema:
        type: string
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
    '404':
      description: Not Found
      content:
        application/json:
          schema:
            $ref: ../components/schemas/errors.AppError.yaml
    '500':
      description: Internal Server Error
      content:
        application/json:
          schema:
            $ref: ../components/schemas/errors.AppError.yaml
