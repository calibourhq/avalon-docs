get:
  operationId: list-bgp-asns
  security:
    - BearerAuth: []
  description: List the BGP ASNs of the active organisation.
  tags:
    - network-bgp
  summary: List BGP ASNs
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: ../components/schemas/bgp.OrgASN.yaml
    '401':
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: ../components/schemas/errors.AppError.yaml
    '500':
      description: Internal Server Error
      content:
        application/json:
          schema:
            $ref: ../components/schemas/errors.AppError.yaml
post:
  operationId: create-bgp-asn
  security:
    - BearerAuth: []
  description: >-
    Submit a new BGP ASN (org_id, asn) for the org. The request starts pending: with verify_email set to one of the registry contacts from /network/bgp/asn-contacts, that address is mailed an approve/deny link; without it (or when the ASN was denied before) the request goes to manual review.
  tags:
    - network-bgp
  summary: Create BGP ASN
  responses:
    '201':
      description: Created
      content:
        application/json:
          schema:
            $ref: ../components/schemas/bgp.OrgASN.yaml
    '400':
      description: Bad Request
      content:
        application/json:
          schema:
            $ref: ../components/schemas/errors.ValidationErrorResponse.yaml
    '401':
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: ../components/schemas/errors.AppError.yaml
    '409':
      description: Conflict
      content:
        application/json:
          schema:
            $ref: ../components/schemas/errors.AppError.yaml
    '429':
      description: Too Many Requests
      content:
        application/json:
          schema:
            $ref: ../components/schemas/errors.AppError.yaml
    '500':
      description: Internal Server Error
      content:
        application/json:
          schema:
            $ref: ../components/schemas/errors.AppError.yaml
