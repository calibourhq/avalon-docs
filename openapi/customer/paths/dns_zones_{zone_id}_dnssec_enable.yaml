post:
  operationId: enable-dnssec
  security:
    - BearerAuth: []
  description: Enables DNSSEC for a zone.
  tags:
    - dns
  summary: Enable DNSSEC
  parameters:
    - description: zone id
      name: zone_id
      in: path
      required: true
      schema:
        type: string
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
    '401':
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: ../components/schemas/errors.AppError.yaml
    '500':
      description: Internal Server Error
      content:
        application/json:
          schema:
            $ref: ../components/schemas/errors.AppError.yaml
