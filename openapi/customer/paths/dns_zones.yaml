get:
  operationId: list-dns-zones
  security:
    - BearerAuth: []
  description: Lists the zones of the active organisation.
  tags:
    - dns
  summary: List DNS zones
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: ../components/schemas/dns.Zone.yaml
    '401':
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: ../components/schemas/errors.AppError.yaml
    '500':
      description: Internal Server Error
      content:
        application/json:
          schema:
            $ref: ../components/schemas/errors.AppError.yaml
post:
  operationId: create-a-dns-zone
  security:
    - BearerAuth: []
  description: >-
    Orders a new DNS zone for org_id on plan_id and billing_cycle. Give a name, or a reverse_prefix (CIDR) for a reverse zone. Optional: soa_nameserver, promo_code. The zone waits for payment of the created invoice.
  tags:
    - dns
  summary: Create a DNS zone
  responses:
    '201':
      description: Created
      content:
        application/json:
          schema:
            $ref: ../components/schemas/dns.Zone.yaml
    '400':
      description: Bad Request
      content:
        application/json:
          schema:
            $ref: ../components/schemas/errors.ValidationErrorResponse.yaml
    '401':
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: ../components/schemas/errors.AppError.yaml
    '500':
      description: Internal Server Error
      content:
        application/json:
          schema:
            $ref: ../components/schemas/errors.AppError.yaml
