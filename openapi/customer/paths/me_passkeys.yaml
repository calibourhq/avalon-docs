get:
  operationId: list-passkeys
  security:
    - BearerAuth: []
  description: Lists the passkeys registered for the current account.
  tags:
    - passkeys
  summary: List passkeys
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: ../components/schemas/api.PasskeyResponse.yaml
    '401':
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: ../components/schemas/errors.AppError.yaml
    '500':
      description: Internal Server Error
      content:
        application/json:
          schema:
            $ref: ../components/schemas/errors.AppError.yaml
