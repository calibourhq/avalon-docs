post:
  operationId: restore-a-vps-from-backup
  security:
    - BearerAuth: []
  description: >-
    Restores the VM from a backup archive; the VM must be powered off. Runs asynchronously.
  tags:
    - vps
  summary: Restore a VPS from backup
  parameters:
    - description: vps id
      name: id
      in: path
      required: true
      schema:
        type: string
  responses:
    '202':
      description: Accepted
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
    '400':
      description: Bad Request
      content:
        application/json:
          schema:
            $ref: ../components/schemas/errors.ValidationErrorResponse.yaml
    '401':
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: ../components/schemas/errors.AppError.yaml
    '409':
      description: Conflict
      content:
        application/json:
          schema:
            $ref: ../components/schemas/errors.AppError.yaml
    '422':
      description: Unprocessable Entity
      content:
        application/json:
          schema:
            $ref: ../components/schemas/errors.AppError.yaml
    '500':
      description: Internal Server Error
      content:
        application/json:
          schema:
            $ref: ../components/schemas/errors.AppError.yaml
