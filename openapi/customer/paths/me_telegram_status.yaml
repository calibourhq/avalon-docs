get:
  operationId: get-telegram-link-status
  security:
    - BearerAuth: []
  description: >-
    Return the Telegram link status for the current account. Only available is set when no Telegram bot is configured.
  tags:
    - self
  summary: Get Telegram link status
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            type: object
            properties:
              available:
                type: boolean
              bot_username:
                type: string
              linked:
                type: boolean
              telegram_first_name:
                type: string
              telegram_username:
                type: string
    '401':
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: ../components/schemas/errors.AppError.yaml
    '500':
      description: Internal Server Error
      content:
        application/json:
          schema:
            $ref: ../components/schemas/errors.AppError.yaml
