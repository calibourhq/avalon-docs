post:
  operationId: revoke-a-pending-vps-cancellation
  security:
    - BearerAuth: []
  description: >-
    Clears the cancel-at-renewal flag so billing resumes on the next renewal run.
  tags:
    - vps
  summary: Revoke a pending VPS cancellation
  parameters:
    - description: vps id
      name: id
      in: path
      required: true
      schema:
        type: string
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
    '400':
      description: Bad Request
      content:
        application/json:
          schema:
            $ref: ../components/schemas/errors.ValidationErrorResponse.yaml
    '401':
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: ../components/schemas/errors.AppError.yaml
    '500':
      description: Internal Server Error
      content:
        application/json:
          schema:
            $ref: ../components/schemas/errors.AppError.yaml
