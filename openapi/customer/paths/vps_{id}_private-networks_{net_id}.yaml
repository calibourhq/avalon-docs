delete:
  operationId: detach-a-private-network-from-a-vps
  security:
    - BearerAuth: []
  description: Detach a private network from a VPS server.
  tags:
    - network-private
  summary: Detach a private network from a VPS
  parameters:
    - description: vps id
      name: id
      in: path
      required: true
      schema:
        type: string
    - description: private network id
      name: net_id
      in: path
      required: true
      schema:
        type: string
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
    '400':
      description: Bad Request
      content:
        application/json:
          schema:
            $ref: ../components/schemas/errors.ValidationErrorResponse.yaml
    '401':
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: ../components/schemas/errors.AppError.yaml
    '500':
      description: Internal Server Error
      content:
        application/json:
          schema:
            $ref: ../components/schemas/errors.AppError.yaml
