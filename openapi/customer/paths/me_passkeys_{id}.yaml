put:
  operationId: rename-passkey
  security:
    - BearerAuth: []
  description: Renames a passkey belonging to the current account.
  tags:
    - passkeys
  summary: Rename passkey
  parameters:
    - description: passkey id
      name: id
      in: path
      required: true
      schema:
        type: string
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            $ref: ../components/schemas/api.PasskeyResponse.yaml
    '400':
      description: Bad Request
      content:
        application/json:
          schema:
            $ref: ../components/schemas/errors.ValidationErrorResponse.yaml
    '401':
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: ../components/schemas/errors.AppError.yaml
    '404':
      description: Not Found
      content:
        application/json:
          schema:
            $ref: ../components/schemas/errors.AppError.yaml
delete:
  operationId: delete-passkey
  security:
    - BearerAuth: []
  description: Deletes a passkey belonging to the current account.
  tags:
    - passkeys
  summary: Delete passkey
  parameters:
    - description: passkey id
      name: id
      in: path
      required: true
      schema:
        type: string
  responses:
    '204':
      description: No Content
    '400':
      description: Bad Request
      content:
        '*/*':
          schema:
            $ref: ../components/schemas/errors.ValidationErrorResponse.yaml
    '401':
      description: Unauthorized
      content:
        '*/*':
          schema:
            $ref: ../components/schemas/errors.AppError.yaml
    '404':
      description: Not Found
      content:
        '*/*':
          schema:
            $ref: ../components/schemas/errors.AppError.yaml
