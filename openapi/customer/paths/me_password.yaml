put:
  operationId: change-password
  security:
    - BearerAuth: []
  description: >-
    Set a new password for the current account. All other sessions are logged out.
  tags:
    - self
  summary: Change password
  requestBody:
    content:
      application/json:
        schema:
          $ref: ../components/schemas/api.UpdatePasswordRequest.yaml
    description: New password
    required: true
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
    '400':
      description: Bad Request
      content:
        application/json:
          schema:
            $ref: ../components/schemas/errors.ValidationErrorResponse.yaml
    '401':
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: ../components/schemas/errors.AppError.yaml
    '500':
      description: Internal Server Error
      content:
        application/json:
          schema:
            $ref: ../components/schemas/errors.AppError.yaml
