get:
  operationId: list-vps-regions-with-clusters
  security:
    - BearerAuth: []
  description: Returns VPS clusters joined with their region metadata.
  tags:
    - vps
  summary: List VPS regions with clusters
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: ../components/schemas/api.regionWithCluster.yaml
    '401':
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: ../components/schemas/errors.AppError.yaml
    '500':
      description: Internal Server Error
      content:
        application/json:
          schema:
            $ref: ../components/schemas/errors.AppError.yaml
