put:
  operationId: update-org-ssh-key
  security:
    - BearerAuth: []
  description: >-
    Edits an existing key's name, description and public key. Requires ssh:write.
  tags:
    - ssh-keys
  summary: Update org SSH key
  parameters:
    - description: org id
      name: id
      in: path
      required: true
      schema:
        type: string
    - description: ssh key id
      name: key_id
      in: path
      required: true
      schema:
        type: string
  requestBody:
    $ref: ../components/requestBodies/Request.yaml
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            $ref: ../components/schemas/sshkeys.SSHKey.yaml
    '400':
      description: Bad Request
      content:
        application/json:
          schema:
            $ref: ../components/schemas/errors.ValidationErrorResponse.yaml
    '401':
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: ../components/schemas/errors.AppError.yaml
    '500':
      description: Internal Server Error
      content:
        application/json:
          schema:
            $ref: ../components/schemas/errors.AppError.yaml
delete:
  operationId: delete-org-ssh-key
  security:
    - BearerAuth: []
  description: Removes a key from an org. Requires ssh:write.
  tags:
    - ssh-keys
  summary: Delete org SSH key
  parameters:
    - description: org id
      name: id
      in: path
      required: true
      schema:
        type: string
    - description: ssh key id
      name: key_id
      in: path
      required: true
      schema:
        type: string
  responses:
    '204':
      description: No Content
    '400':
      description: Bad Request
      content:
        application/json:
          schema:
            $ref: ../components/schemas/errors.ValidationErrorResponse.yaml
    '401':
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: ../components/schemas/errors.AppError.yaml
    '500':
      description: Internal Server Error
      content:
        application/json:
          schema:
            $ref: ../components/schemas/errors.AppError.yaml
