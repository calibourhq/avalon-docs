delete:
  operationId: delete-sub-prefix
  security:
    - BearerAuth: []
  description: Delete a BYOIP sub-prefix and its floating route.
  tags:
    - network-bgp
  summary: Delete sub-prefix
  parameters:
    - description: byoip prefix id
      name: id
      in: path
      required: true
      schema:
        type: string
    - description: sub-prefix id
      name: prefix_id
      in: path
      required: true
      schema:
        type: string
  responses:
    '202':
      description: Accepted
    '400':
      description: Bad Request
      content:
        application/json:
          schema:
            $ref: ../components/schemas/errors.ValidationErrorResponse.yaml
    '401':
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: ../components/schemas/errors.AppError.yaml
    '404':
      description: Not Found
      content:
        application/json:
          schema:
            $ref: ../components/schemas/errors.AppError.yaml
    '500':
      description: Internal Server Error
      content:
        application/json:
          schema:
            $ref: ../components/schemas/errors.AppError.yaml
patch:
  operationId: update-sub-prefix
  security:
    - BearerAuth: []
  description: Update the destination service of a BYOIP sub-prefix.
  tags:
    - network-bgp
  summary: Update sub-prefix
  parameters:
    - description: byoip prefix id
      name: id
      in: path
      required: true
      schema:
        type: string
    - description: sub-prefix id
      name: prefix_id
      in: path
      required: true
      schema:
        type: string
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            $ref: ../components/schemas/bgp.BYOIPSubPrefix.yaml
    '400':
      description: Bad Request
      content:
        application/json:
          schema:
            $ref: ../components/schemas/errors.ValidationErrorResponse.yaml
    '401':
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: ../components/schemas/errors.AppError.yaml
    '500':
      description: Internal Server Error
      content:
        application/json:
          schema:
            $ref: ../components/schemas/errors.AppError.yaml
