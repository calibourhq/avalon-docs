post:
  operationId: unmount-an-iso-from-a-vps
  security:
    - BearerAuth: []
  description: Detaches the currently mounted ISO from the server.
  tags:
    - vps
  summary: Unmount an ISO from a VPS
  parameters:
    - description: VPS server id
      name: id
      in: path
      required: true
      schema:
        type: string
  responses:
    '204':
      description: No Content
    '401':
      description: Unauthorized
      content:
        '*/*':
          schema:
            $ref: ../components/schemas/errors.AppError.yaml
    '404':
      description: Not Found
      content:
        '*/*':
          schema:
            $ref: ../components/schemas/errors.AppError.yaml
    '500':
      description: Internal Server Error
      content:
        '*/*':
          schema:
            $ref: ../components/schemas/errors.AppError.yaml
