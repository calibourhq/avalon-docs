put:
  operationId: update-a-smart-record
  security:
    - BearerAuth: []
  description: Updates a smart DNS record.
  tags:
    - dns
  summary: Update a smart record
  parameters:
    - description: zone id
      name: zone_id
      in: path
      required: true
      schema:
        type: string
    - description: smart record id
      name: smart_id
      in: path
      required: true
      schema:
        type: string
  requestBody:
    $ref: ../components/requestBodies/dns.SmartRecordInput.yaml
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            $ref: ../components/schemas/dns.SmartRecord.yaml
    '400':
      description: Bad Request
      content:
        application/json:
          schema:
            $ref: ../components/schemas/errors.ValidationErrorResponse.yaml
    '401':
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: ../components/schemas/errors.AppError.yaml
    '500':
      description: Internal Server Error
      content:
        application/json:
          schema:
            $ref: ../components/schemas/errors.AppError.yaml
delete:
  operationId: delete-a-smart-record
  security:
    - BearerAuth: []
  description: Removes a smart DNS record.
  tags:
    - dns
  summary: Delete a smart record
  parameters:
    - description: zone id
      name: zone_id
      in: path
      required: true
      schema:
        type: string
    - description: smart record id
      name: smart_id
      in: path
      required: true
      schema:
        type: string
  responses:
    '204':
      description: No Content
    '400':
      description: Bad Request
      content:
        '*/*':
          schema:
            $ref: ../components/schemas/errors.ValidationErrorResponse.yaml
    '401':
      description: Unauthorized
      content:
        '*/*':
          schema:
            $ref: ../components/schemas/errors.AppError.yaml
    '500':
      description: Internal Server Error
      content:
        '*/*':
          schema:
            $ref: ../components/schemas/errors.AppError.yaml
