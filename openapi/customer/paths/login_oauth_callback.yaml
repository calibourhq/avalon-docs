post:
  security: []
  operationId: complete-oauth-login
  description: Completes the OIDC code flow, verifies the ID token, and issues a session.
  tags:
    - auth
  summary: Complete OAuth login
  requestBody:
    content:
      application/json:
        schema:
          $ref: ../components/schemas/api.OAuthCallbackRequest.yaml
    description: OAuth state and authorization code
    required: true
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            $ref: ../components/schemas/api.OAuthCallbackResponse.yaml
    '400':
      description: Bad Request
      content:
        application/json:
          schema:
            $ref: ../components/schemas/errors.ValidationErrorResponse.yaml
    '401':
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: ../components/schemas/errors.AppError.yaml
    '500':
      description: Internal Server Error
      content:
        application/json:
          schema:
            $ref: ../components/schemas/errors.AppError.yaml
