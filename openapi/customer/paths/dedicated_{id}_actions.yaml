get:
  operationId: list-the-actions-available-for-a-server
  security:
    - BearerAuth: []
  description: Returns {actions, available, unavailable_reason}.
  tags:
    - dedicated
  summary: List the actions available for a server
  parameters:
    - description: service id
      name: id
      in: path
      required: true
      schema:
        type: string
    - description: only actions carrying this tag
      name: tag
      in: query
      schema:
        type: string
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
post:
  operationId: start-an-action-on-a-server
  security:
    - BearerAuth: []
  tags:
    - dedicated
  summary: Start an action on a server
  parameters:
    - description: service id
      name: id
      in: path
      required: true
      schema:
        type: string
  requestBody:
    content:
      application/json:
        schema:
          $ref: ../components/schemas/api.startActionBody.yaml
    description: Action and its input values
    required: true
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            $ref: ../components/schemas/api.actionRunView.yaml
