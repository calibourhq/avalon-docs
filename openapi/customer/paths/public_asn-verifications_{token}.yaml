get:
  security: []
  operationId: get-asn-verification-request
  description: >-
    Show the ASN request a mailed verification token belongs to, while it is still open.
  tags:
    - network-bgp
  summary: Get ASN verification request
  parameters:
    - description: verification token
      name: token
      in: path
      required: true
      schema:
        type: string
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
    '404':
      description: Not Found
      content:
        application/json:
          schema:
            $ref: ../components/schemas/errors.AppError.yaml
