post:
  security: []
  operationId: request-a-user-password-reset
  description: >-
    Queues a password reset email if a matching local account exists; always returns 200 to prevent email enumeration.
  tags:
    - auth
  summary: Request a user password reset
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
    '400':
      description: Bad Request
      content:
        application/json:
          schema:
            $ref: ../components/schemas/errors.ValidationErrorResponse.yaml
