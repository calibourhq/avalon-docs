get:
  operationId: get-support-ticket
  security:
    - BearerAuth: []
  description: >-
    Returns a ticket of the active organisation with its messages, events and whether a reply is possible (ticket, messages, events, can_reply).
  tags:
    - support
  summary: Get support ticket
  parameters:
    - description: ticket id
      name: id
      in: path
      required: true
      schema:
        type: string
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
    '401':
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: ../components/schemas/errors.AppError.yaml
    '404':
      description: Not Found
      content:
        application/json:
          schema:
            $ref: ../components/schemas/errors.AppError.yaml
    '500':
      description: Internal Server Error
      content:
        application/json:
          schema:
            $ref: ../components/schemas/errors.AppError.yaml
