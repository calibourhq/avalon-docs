put:
  operationId: update-theme-preference
  security:
    - BearerAuth: []
  description: Set the preferred UI theme (system, light or dark) for the current account.
  tags:
    - self
  summary: Update theme preference
  requestBody:
    content:
      application/json:
        schema:
          $ref: ../components/schemas/api.UpdateThemeRequest.yaml
    description: Theme
    required: true
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            type: object
            properties:
              preferred_theme:
                type: string
    '400':
      description: Bad Request
      content:
        application/json:
          schema:
            $ref: ../components/schemas/errors.ValidationErrorResponse.yaml
    '401':
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: ../components/schemas/errors.AppError.yaml
    '500':
      description: Internal Server Error
      content:
        application/json:
          schema:
            $ref: ../components/schemas/errors.AppError.yaml
