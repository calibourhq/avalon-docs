get:
  operationId: list-my-invites
  security:
    - BearerAuth: []
  description: Returns pending invites addressed to the current user.
  tags:
    - self
  summary: List my invites
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: ../components/schemas/orgs.OrgInviteDetail.yaml
    '401':
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: ../components/schemas/errors.AppError.yaml
    '500':
      description: Internal Server Error
      content:
        application/json:
          schema:
            $ref: ../components/schemas/errors.AppError.yaml
