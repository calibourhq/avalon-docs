post:
  operationId: set-a-vps-ptr-record
  security:
    - BearerAuth: []
  description: Creates or updates a PTR record for an IP associated with this server.
  tags:
    - vps
  summary: Set a VPS PTR record
  parameters:
    - description: server id
      name: id
      in: path
      required: true
      schema:
        type: string
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
    '400':
      description: Bad Request
      content:
        application/json:
          schema:
            $ref: ../components/schemas/errors.ValidationErrorResponse.yaml
    '401':
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: ../components/schemas/errors.AppError.yaml
    '500':
      description: Internal Server Error
      content:
        application/json:
          schema:
            $ref: ../components/schemas/errors.AppError.yaml
delete:
  operationId: delete-a-vps-ptr-record
  security:
    - BearerAuth: []
  description: Removes the PTR record for an IP associated with this server.
  tags:
    - vps
  summary: Delete a VPS PTR record
  parameters:
    - description: server id
      name: id
      in: path
      required: true
      schema:
        type: string
  responses:
    '204':
      description: No Content
    '400':
      description: Bad Request
      content:
        application/json:
          schema:
            $ref: ../components/schemas/errors.ValidationErrorResponse.yaml
    '401':
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: ../components/schemas/errors.AppError.yaml
    '500':
      description: Internal Server Error
      content:
        application/json:
          schema:
            $ref: ../components/schemas/errors.AppError.yaml
