get:
  operationId: list-support-departments
  security:
    - BearerAuth: []
  description: Lists the public support departments a ticket can be opened in.
  tags:
    - support
  summary: List support departments
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: ../components/schemas/support.SupportDepartment.yaml
    '401':
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: ../components/schemas/errors.AppError.yaml
    '500':
      description: Internal Server Error
      content:
        application/json:
          schema:
            $ref: ../components/schemas/errors.AppError.yaml
