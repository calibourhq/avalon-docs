post:
  operationId: create-nowpayments-checkout
  security:
    - BearerAuth: []
  description: >-
    Creates a direct NOWPayments crypto payment and returns the address and amount to send.
  tags:
    - invoices
  summary: Create NOWPayments checkout
  parameters:
    - description: invoice id
      name: inv_id
      in: path
      required: true
      schema:
        type: string
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
    '400':
      description: Bad Request
      content:
        application/json:
          schema:
            $ref: ../components/schemas/errors.ValidationErrorResponse.yaml
    '401':
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: ../components/schemas/errors.AppError.yaml
    '500':
      description: Internal Server Error
      content:
        application/json:
          schema:
            $ref: ../components/schemas/errors.AppError.yaml
