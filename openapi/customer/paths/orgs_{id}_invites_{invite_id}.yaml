delete:
  operationId: cancel-an-organisation-invite
  security:
    - BearerAuth: []
  description: Cancels a pending invite. Requires the org admin permission.
  tags:
    - orgs
  summary: Cancel an organisation invite
  parameters:
    - description: organisation id
      name: id
      in: path
      required: true
      schema:
        type: string
    - description: invite id
      name: invite_id
      in: path
      required: true
      schema:
        type: string
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
    '400':
      description: Bad Request
      content:
        application/json:
          schema:
            $ref: ../components/schemas/errors.ValidationErrorResponse.yaml
    '401':
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: ../components/schemas/errors.AppError.yaml
    '500':
      description: Internal Server Error
      content:
        application/json:
          schema:
            $ref: ../components/schemas/errors.AppError.yaml
