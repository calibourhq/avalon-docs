post:
  security: []
  operationId: approve-asn-verification-request
  description: The ASN's registry contact approves the request; the ASN becomes active.
  tags:
    - network-bgp
  summary: Approve ASN verification request
  parameters:
    - description: verification token
      name: token
      in: path
      required: true
      schema:
        type: string
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
    '404':
      description: Not Found
      content:
        application/json:
          schema:
            $ref: ../components/schemas/errors.AppError.yaml
