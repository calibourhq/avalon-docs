type: object
required:
  - prefix
  - service_type
properties:
  byoip_prefix_id:
    type: string
  created_at:
    type: string
  floating_route_id:
    type: string
  id:
    type: string
  last_error:
    description: |-
      LastError is derived at read time from the backing floating route (see
      hydrateSubPrefixStatus); it is not persisted on the sub-prefix row.
    type: string
  prefix:
    type: string
    maxLength: 50
  service_id:
    type: string
  service_type:
    type: string
    maxLength: 30
  status:
    type: string
  updated_at:
    type: string
