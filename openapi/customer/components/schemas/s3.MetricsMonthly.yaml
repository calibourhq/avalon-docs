type: object
properties:
  bandwidth_bytes:
    description: |-
      Derived, populated on read (not stored): the three limit classes, so the
      UI does not re-derive the grouping.
    type: integer
  bucket_id:
    type: string
  bytes_in:
    description: |-
      BytesIn is upload traffic (request bodies), BytesOut download traffic
      (response bodies), both measured on the wire.
    type: integer
  bytes_out:
    type: integer
  id:
    type: integer
  month:
    description: Month is midnight UTC on the first day of the month.
    type: string
  ops_copy:
    type: integer
  ops_delete:
    type: integer
  ops_get:
    type: integer
  ops_head:
    type: integer
  ops_list:
    type: integer
  ops_other:
    type: integer
  ops_put:
    type: integer
  ops_read:
    type: integer
  ops_search:
    type: integer
  ops_write:
    type: integer
