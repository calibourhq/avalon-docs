type: object
properties:
  cdn_rule_id:
    type: string
  conditions:
    description: |-
      No FK constraint here, deliberately. This column already exists and
      already has rows, and orphans are guaranteed on any deployment that has
      ever deleted a CDN record: the delete path removed the rule but not its
      groups or conditions. AutoMigrate would try to ADD CONSTRAINT, MySQL and
      Postgres would reject it against those orphans, and a failed AutoMigrate
      is fatal. (SQLite cannot ALTER in a constraint at all, so a passing local
      test proves nothing here.) The cascade is done explicitly in Go instead,
      on every delete path; a later cleanup migration can purge the orphans and
      add the constraint once the data is known to be sound.
    type: array
    items:
      $ref: ./cdn.CDNRuleCondition.yaml
  created_at:
    type: string
  id:
    type: string
  match:
    description: all, any
    type: string
  negate:
    type: boolean
  sort_order:
    type: integer
  updated_at:
    type: string
