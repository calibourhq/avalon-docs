type: object
properties:
  cdn_record_id:
    type: string
  created_at:
    type: string
  expires_at:
    type: string
  failure_count:
    type: integer
  id:
    type: string
  last_attempt_at:
    description: |-
      LastAttemptAt is when issuance was last started, so a zone that never
      gets picked up is distinguishable from one actively retrying.
    type: string
  last_failure_message:
    type: string
  next_retry_after:
    type: string
  phase:
    description: |-
      Phase is the current step of an in-flight issuance (see cert phase
      constants) so a stuck "issuing" tells you where it is stuck.
    type: string
  status:
    description: |-
      Status is the coarse lifecycle state the UI badges off of:
      pending (queued, nothing attempted yet), issuing (an attempt is in
      flight), valid (certificate installed), error (last attempt failed).
    type: string
  updated_at:
    type: string
